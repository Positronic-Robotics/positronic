[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "positronic"
version = "0.2.1"
description = "Positronic robotics project"
requires-python = ">=3.11, <3.14"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "av",
    "coloredlogs>=15.0.1",
    "configuronic>=0.7.0",
    "cvxopt",
    "dearpygui; platform_machine != 'aarch64'",
    "fastapi",
    "starlette>=1.0.0",
    "jinja2",
    "fire",
    "httpx",
    "msgpack",
    "mujoco",
    "numpy",
    "opencv-python-headless",
    "opentelemetry-api>=1.42",  # no-op span surface; the SDK ships in the `telemetry` extra
    # openpi-client: optional, see [project.optional-dependencies] openpi
    "plotly>=6.5.0",
    "pos3>=0.3.1",
    # The platform's wire contract, which `positronic eval run --policy-image` and
    # `positronic account` speak. A workspace member in a clone (see [tool.uv.sources]); a released
    # `positronic` resolves it from the index, so the client is published first
    # (.github/workflows/release.yaml). Pinned exactly, because that package guarantees no
    # backwards compatibility: a floating requirement would let a fresh install of THIS release
    # resolve a contract it was never built against.
    "positronic-platform-client==0.3.0",
    "psutil",  # `positronic-server` enumerates local interfaces to name a wildcard bind's addresses
    "pyarrow",
    "pydantic",
    "pyturbojpeg<2",
    "pyyaml",
    "rerun-sdk==0.30.0",
    "robosuite",
    "ruckig",
    "scipy",
    "uvicorn[standard]",
    "websockets>=15.0.1",
    "zmq",  # TODO: move to gr00t vendor optional dep
]

[project.scripts]
positronic="positronic.cli:_internal_main"
positronic-server="positronic.server.positronic_server:_internal_main"
positronic-inference="positronic.inference:_internal_main"
positronic-probe="positronic.probe:_internal_main"
positronic-data-collection="positronic.data_collection:_internal_main"


[project.optional-dependencies]
openpi = [
    "openpi-client",  # TODO: replace with positronic-native WebSocket client using positronic.utils.serialization
]
hardware = [
    "feetech-servo-sdk", # for feetech motors
    "positronic-franka>=0.7.0; sys_platform == 'linux'",
    # "kortex_api; sys_platform == 'linux'",  # Kinova: disabled, artifactory.kinovaapps.com is unreliable
    "linuxpy",  # For Linux video capture
    "placo",
    "pyaudio; sys_platform == 'linux'",  # For SoundSystem
    "pymodbus",  # For grippers
    "pyserial", # For grippers
    "pyzed; sys_platform == 'linux'",  # ZED camera support
]
lerobot_0_3_3 = [
    "lerobot==0.3.3",
    "timm",
    "torch",
]
lerobot = [
    "lerobot[smolvla]==0.4.3",
    "torch",
]
molmoact2 = [
    "transformers>=5.3,<6",
    "torch",
    "torchvision",
    "accelerate",
    "pillow",
    "einops",
    "requests",
    "protobuf",
    "sentencepiece",
]
dreamzero = [
    "huggingface-hub",
]
lance = [
    "pylance",
]
yam = [
    "i2rt",  # i2rt YAM arm: joint-space position-PD + gravity-comp over CAN; not on PyPI, see [tool.uv.sources]
]
trossen = [
    # Trossen WidowX AI arm, over Ethernet. The SDK version must match the arm firmware version.
    "trossen-arm>=1.11,<1.12",
]
telemetry = [
    # `positronic eval run --timing` only: the OTel SDK + exporter that write the span sidecars, and the
    # machine-load sampler's probes.
    "nvidia-ml-py",
    "opentelemetry-exporter-otlp-json-file>=0.65b0",
    "opentelemetry-sdk>=1.42",
]

# A dependency group rather than an extra, so `uv run` and `uv sync` include it without being asked.
# An extra has to be named on every invocation, and one command that forgets uninstalls the tools the
# next one needs. Exclude it with `--no-dev` where an image must stay lean.
# `pre-commit` is absent deliberately: the git hook it installs must survive a sync that does not name
# it, so it is a uv tool (`uv tool install pre-commit`), outside this venv.
[dependency-groups]
dev = [
    "ruff",
    "basedpyright",
    "pybind11-stubgen",  # regenerates stubs/mujoco (utilities/generate_mujoco_stubs.py)
    "ipython",
    "jupyter",
    "opencv-python",
    "coverage",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-timeout",
    "pytest-xdist",
    "pytest",
    "rerun-sdk[notebook]",
    "cryptography",  # the server's certificate tests read the certificate itself
    "positronic[telemetry]",  # the telemetry tests exercise the SDK and the samplers
]

[tool.uv.workspace]
# `client/` builds the standalone `positronic-platform-client` distribution, which stays installable
# on its own — it may depend on nothing in this repo.
members = ["client"]

[tool.uv]
# lerobot_0_3_3 extra pulls in lerobot==0.3.3 which declares rerun-sdk<0.23,
# but our usage of lerobot doesn't need rerun — override to unblock resolution.
override-dependencies = ["rerun-sdk==0.30.0"]
# cmake 4.3.1 is missing x86_64 Linux wheels on PyPI.
# evdev>=1.9 regenerates its C bindings from whatever input-event-codes.h is reachable on the
# include path, so a newer header leaking in (stale build cache / CPATH) bakes in macros the
# ubuntu22.04 (kernel-5.15) compile headers lack and the build fails. 1.8.x reads the canonical
# /usr/include and is structurally immune; pynput only needs evdev>=1.3.
# numpy 2.5 outpaces numba: robosuite pulls in numba, whose newest release still caps numpy<2.5,
# so an unconstrained resolve (e.g. `uv pip install .`, which has no lockfile to pin numpy) floats
# numpy to 2.5 and backtracks numba to 0.53.1 -> llvmlite 0.36.0, which has no cp312/cp313 wheels
# and fails to build. Cap numpy until numba supports 2.5; the full lock already sits at 2.3.5.
constraint-dependencies = ["cmake<4.3", "evdev<1.9", "numpy<2.5"]
# ruckig is source-only and its build backend is unpinned (`scikit-build-core`). ruckig 0.15.3's
# `[tool.scikit-build] cmake.targets` is rejected by scikit-build-core>=0.10 ("Use build.targets
# instead"), so a wider exclude-newer that admits 0.10+ into the isolated build env breaks the
# wheel build. Constrain only the build backend, leaving runtime resolution untouched.
build-constraint-dependencies = ["scikit-build-core<0.10"]
# Pin third-party resolution to a fixed point in time. This serves two ends. First, reproducibility:
# `uv sync --locked` resolves identically across machines and CI regardless of contributors' personal uv config,
# and because `uv lock` reads this date the lockfile can never drift ahead of it. Second, supply-chain safety: it
# holds third-party deps to at least ~1 week old, so a compromised release has time to be caught and yanked before
# we would pick it up. That week-long buffer is also why bumping this date to roughly one week before today is
# generally safe at any time; do it and re-run `uv lock` in the same commit to refresh deps. Our own packages
# (exclude-newer-package below) are exempt so they always resolve to the latest release.
exclude-newer = "2026-07-21T00:00:00Z"
conflicts = [
    [
        {extra = "lerobot"},
        {extra = "lerobot-0-3-3"},
        {extra = "molmoact2"},
        {extra = "yam"},
    ],
]

[tool.uv.exclude-newer-package]
positronic = false
configuronic = false
pos3 = false
positronic-franka = false

[tool.uv.sources]
positronic-platform-client = { workspace = true }
# ZED SDK ships one ABI-specific wheel per CPython version; pick by interpreter.
pyzed = [
    { url = "https://download.stereolabs.com/zedsdk/5.0/whl/linux_x86_64/pyzed-5.0-cp311-cp311-linux_x86_64.whl", marker = "python_full_version < '3.12'" },
    { url = "https://download.stereolabs.com/zedsdk/5.0/whl/linux_x86_64/pyzed-5.0-cp312-cp312-linux_x86_64.whl", marker = "python_full_version >= '3.12' and python_full_version < '3.13'" },
    { url = "https://download.stereolabs.com/zedsdk/5.0/whl/linux_x86_64/pyzed-5.0-cp313-cp313-linux_x86_64.whl", marker = "python_full_version >= '3.13'" },
]
openpi-client = { git = "https://github.com/Positronic-Robotics/openpi.git", rev = "main-positronic", subdirectory = "packages/openpi-client" }
i2rt = { git = "https://github.com/i2rt-robotics/i2rt.git", rev = "5d47b358bafb30c65e397f2ece506550a0db4594" }

[tool.pytest.ini_options]
# Search roots, not a list of suites, so a new `tests/` directory is collected without being registered
testpaths = ["client", "pimm", "positronic", "utilities"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    # The suite waits on spawned processes and sockets about as much as it computes, so it scales with cores.
    # `-n0` puts it back in one process, which live logs and `--pdb` need.
    "-n", "auto",
    # Needs the `libero` extra and OSMesa; `libero-e2e.yaml` runs it by path, which `--ignore` allows.
    "--ignore=positronic/simulator/libero/tests/test_e2e.py",
]
filterwarnings = [
    "ignore:.*DISPLAY environment variable is missing:glfw.GLFWError",
]
markers = [
    "endpoint: what a served endpoint must do. Runs in-process, or against POSITRONIC_ENDPOINT_URL when it names one",
]

[tool.coverage.run]
branch = true
source = ["pimm", "platform_client", "positronic"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
extend-exclude = ["stubs"]  # generated from the mujoco binary modules; not ours to style
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PLC0415",  # imports belong at the top of the file
    "C90", # mccabe cyclomatic complexity (threshold below)
]
ignore = [
    "E203",  # whitespace before ':'
    "B019",  # Use of functools.lru_cache on methods - intentional for performance
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py files
"positronic/cfg/**" = ["PLC0415"]  # Configs defer hardware imports into their `@cfn.config` bodies

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
preview = true
skip-magic-trailing-comma = true

[tool.basedpyright]
# Grandfathered ratchet: every error present when this landed is captured in
# .basedpyright/baseline.json; only NEW errors fail. Modules are strictened incrementally.
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["client", "pimm", "positronic"]
# mujoco ships no `.pyi` and re-exports from binary extension modules, so its whole API reads as
# attribute errors without these. Regenerate with utilities/generate_mujoco_stubs.py.
stubPath = "stubs"
# vendors/* pull untyped ML libraries; they are typed per-vendor in a later pass.
exclude = [
    "**/.venv",
    "**/node_modules",
    "positronic/vendors",
]
# `exclude` only drops vendors as analysis roots; a checked module that imports them
# still pulls their diagnostics. `ignore` suppresses those transitive vendor errors too.
ignore = ["positronic/vendors"]

# ``robolab/env.py`` runs in RoboLab's isolated interpreter with the env-server modules (``server``,
# ``protocol``, ``telemetry``) copied flat onto PYTHONPATH, so it imports them top-level. Put ``env_server``
# on the search path for that directory so those flat imports resolve for the type checker exactly as they
# do at runtime; the project root stays on the path so the other robolab files' ``positronic.*`` imports
# (an editable install the checker resolves by search path) keep resolving.
[[tool.basedpyright.executionEnvironments]]
root = "positronic/simulator/robolab"
extraPaths = [".", "positronic/simulator/env_server"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "positronic*",
    "pimm*",
]

[tool.setuptools.package-data]
# Include static assets and XML files needed at runtime
positronic = [
  "assets/**",
  "drivers/**/*.xml",
  "drivers/**/*.urdf",
  "server/static/**",
  "server/templates/**",
]
