[project]
name = "positronic-platform-client"
version = "0.39.1"
description = "Typed wire contract and HTTP client for the Positronic evaluation platform API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# No robotics or web stack: a service that only speaks to the platform installs this subdirectory alone
# (`git+…#subdirectory=client`) and must not pull the robotics stack in behind it.
dependencies = [
    # 2.11 is the first that takes a TypeVar with constraints and a default, which `EvalPlan` is generic in.
    "pydantic>=2.11",
    "httpx>=0.27",
    "typing-extensions>=4.12.2",
    # The eval names and the wire codec of an enum. The root pins it exactly at the same version.
    "positronic-evals==0.1.1",
]

[project.scripts]
platform-register = "platform_client.device_flow:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `platform_client` carries no `__init__.py`; hatchling ships the named directory verbatim, py.typed
# among them — without it a type checker treats an INSTALLED copy as untyped and ignores every
# annotation this package exists to publish (PEP 561).
packages = ["platform_client"]
