[project]
name = "positronic-eval-vocabulary"
# The words an attended rollout records. Bumped by the change that edits this distribution, so a
# consumer pinning it can say which words it was written against.
version = "0.1.0"
description = "The vocabulary an attended rollout records: the operator's verdict and the progress ladder"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Nothing, ever. A reader of a recording installs this alone — the coordinator that reads episodes
# without a robot, the report, the console on the rig — so it must pull neither the robotics stack
# nor a web stack nor pydantic in behind it.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_vocabulary"]
