[project]
name = "positronic-eval-vocabulary"
# The words an attended rollout records. Bumped by the change that edits this distribution, so a
# consumer pinning it can say which words it was written against.
version = "0.4.0"
description = "The words a recorded episode holds and the rule that counts it: the verdict, the policy end, the edit log and the progress ladder"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# None, so a reader of a recording installs this alone and pulls in no robotics or web stack.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_vocabulary"]
