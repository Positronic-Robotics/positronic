<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Teleop</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; margin: 24px; }
    #state { font-size: 28px; margin-bottom: 8px; }
    #task { font-size: 20px; margin-bottom: 16px; }
    button { font-size: 22px; padding: 12px 28px; margin-right: 12px; }
    #error { color: #f88; min-height: 1.5em; }
    img { display: block; margin-top: 16px; max-width: 100%; }
  </style>
</head>
<body>
  <div id="state">Waiting for a trial</div>
  <div id="task"></div>
  <button id="ready" disabled>Ready</button>
  <button id="cancel" disabled>Cancel</button>
  <div id="error"></div>
  <img id="view" alt="What the headset shows">
  <script>
    const STATE = {
      IDLE: 'Waiting for a trial',
      READY_WAIT: 'Human trial: put on the headset, then press Ready',
      RUNNING: 'Trial running',
      ENDED: 'The trial ended: give the verdict on the console',
    };
    let shownPhase = null;

    async function post(path) {
      const answer = await fetch(path, { method: 'POST' });
      document.getElementById('error').textContent = answer.ok ? '' : (await answer.json()).detail;
      render(answer.ok ? await answer.json() : null);
    }

    function render(status) {
      if (status === null) return;
      document.getElementById('state').textContent = STATE[status.phase];
      document.getElementById('task').textContent = status.task;
      const waiting = status.phase === 'READY_WAIT';
      document.getElementById('ready').disabled = !waiting;
      document.getElementById('cancel').disabled = !waiting;
      if (waiting && shownPhase !== 'READY_WAIT') {
        document.title = 'Human trial';
        window.focus();
      } else if (!waiting) {
        document.title = 'Teleop';
      }
      shownPhase = status.phase;
    }

    async function poll() {
      try {
        render(await (await fetch('/status')).json());
        document.getElementById('view').src = '/view.jpg?t=' + Date.now();
      } catch (e) {
        document.getElementById('error').textContent = 'The teleop service does not answer';
      }
      setTimeout(poll, 200);
    }

    document.getElementById('ready').onclick = () => post('/ready');
    document.getElementById('cancel').onclick = () => post('/cancel');
    poll();
  </script>
</body>
</html>
