name: Build and Push the GR00T N1.7 DROID Serving Image

# Main republishes positro/gr00t-n17-droid on a change to its recipe, its build,
# or the packages and manifests it installs.
on:
  push:
    branches:
      - main
    paths:
      - docker/Dockerfile.serve-gr00t-n17-droid
      - docker/Makefile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - README.md
      - LICENSE
      - positronic/**
      - pimm/**
      - client/**
      - wire/**
      - model_server/**
      - vocabulary/**
      - .github/workflows/docker-serve-gr00t-n17-droid.yaml
      - .github/workflows/docker-serve-image.yaml
      - '!**/tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serve-gr00t-n17-droid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  serve-image:
    uses: ./.github/workflows/docker-serve-image.yaml
    with:
      name: gr00t-n17-droid
    secrets: inherit
