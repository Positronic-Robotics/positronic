name: Build and Push the GR00T N1.7 DROID Serving Images

# Main republishes positro/gr00t-n17-droid and positro/gr00t-n17-droid-rtc on a change
# to their recipes, their build, or the packages and manifests they install.
on:
  push:
    branches:
      - main
    paths:
      - docker/Dockerfile.serve-gr00t-n17-droid
      - docker/Dockerfile.serve-gr00t-n17-droid-rtc
      - docker/install-model-server-deps.sh
      - docker/Makefile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - README.md
      - LICENSE
      - positronic/**
      - pimm/**
      - client/**
      - wire/**
      - model_server/**
      - vocabulary/**
      - evals/**
      - .github/workflows/docker-serve-gr00t-n17-droid.yaml
      - .github/workflows/docker-serve-image.yaml
      - '!**/tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serve-gr00t-n17-droid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  serve-image:
    uses: ./.github/workflows/docker-serve-image.yaml
    with:
      name: gr00t-n17-droid
    secrets: inherit

  # The RTC image starts the image above with `droid_rtc`, and its build reads that image from the registry.
  serve-image-rtc:
    needs: serve-image
    uses: ./.github/workflows/docker-serve-image.yaml
    with:
      name: gr00t-n17-droid-rtc
    secrets: inherit
