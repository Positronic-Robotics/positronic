name: Build a Serving Image

# Builds positro/<name> from docker/Dockerfile.serve-<name> and checks it. On main it pushes `main`, the commit and
# `latest`; on a release, `v<version>` and the commit.
on:
  workflow_call:
    inputs:
      name:
        description: The image, one of SERVE_IMAGES in docker/Makefile.
        required: true
        type: string
      release:
        description: Push `v<version>` and leave `latest` where it is.
        required: false
        type: boolean
        default: false
    secrets:
      HF_TOKEN:
        required: false
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  # GitHub withholds secrets from a pull request opened from a fork or by Dependabot.
  token:
    runs-on: ubuntu-latest
    outputs:
      can_build: ${{ steps.check.outputs.can_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: docker
      - id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RECIPE: docker/Dockerfile.serve-${{ inputs.name }}
        run: |
          if grep -q 'id=hf_token' "$RECIPE" && [ -z "$HF_TOKEN" ] && [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo '::notice::This pull request gets no HF_TOKEN, so the gated download cannot run. The build is skipped.'
            echo can_build=false >> "$GITHUB_OUTPUT"
          else
            echo can_build=true >> "$GITHUB_OUTPUT"
          fi

  serve-image:
    needs: token
    if: needs.token.outputs.can_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NAME: ${{ inputs.name }}
      IMAGE: positro/${{ inputs.name }}
      # A recipe reads it through a BuildKit secret mount.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A build holds the weights twice, in their own stage and in the image.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/lib/jvm
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"/{CodeQL,node,go}
          df -h /

      - name: Build
        run: |
          make -C docker "build-serve-${NAME}"
          df -h /

      # The platform runs the image with the network denied. The server refuses a token no header can carry before
      # it loads the model, so this start proves the entrypoint and the environment need no network.
      - name: Check the offline start
        run: |
          if docker run --rm --network none -e AUTH_TOKEN='two words' "${IMAGE}:local" 2> start.log; then
            echo 'the server started with a token no header can carry' >&2
            exit 1
          fi
          cat start.log
          grep -F 'auth_token must be non-empty printable ASCII' start.log

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Check the image budgets
        run: |
          sudo apt-get install -y --no-install-recommends pigz
          uv run --package positronic-platform-client --no-dev docker/check_image_budget.py "${IMAGE}:local"

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' || inputs.release
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push
        id: push
        if: github.ref == 'refs/heads/main' || inputs.release
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ "$RELEASE" = true ]; then
            # A release may be cut from a commit that is not on main, so it must not move `latest`.
            unset CI
            export PUBLISH_RELEASE=1
            tag="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)"
          else
            tag=main
          fi
          make -C docker "push-serve-${NAME}" IMAGE_TAG="$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Reads anonymously, as the platform does, so a repository that is not public fails here.
      - name: Read the published digest and size
        if: github.ref == 'refs/heads/main' || inputs.release
        run: docker/read_image_digest.sh "${IMAGE}:${{ steps.push.outputs.tag }}"
