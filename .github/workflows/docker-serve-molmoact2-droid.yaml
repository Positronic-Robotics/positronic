name: Build and Push the MolmoAct2 DROID Serving Image

# Main republishes positro/molmoact2-droid on a change to its recipe, its vendor code or a workflow.
on:
  push:
    branches:
      - main
    paths:
      - docker/Dockerfile.serve-molmoact2-droid
      - positronic/vendors/molmoact2/**
      - .github/workflows/docker-serve-molmoact2-droid.yaml
      - .github/workflows/docker-serve-image.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serve-molmoact2-droid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  serve-image:
    uses: ./.github/workflows/docker-serve-image.yaml
    with:
      name: molmoact2-droid
    secrets: inherit
