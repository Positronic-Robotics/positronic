name: Run unit tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  core:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
        include:
          - {os: macos-latest, python: '3.13'}
    steps:
      - uses: actions/checkout@v4
      - name: Enable caching
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv --python ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        env:
          PYTHONPATH: ${{ env.PYTHONPATH }}:$PWD
        run: uv run pytest

  gstreamer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enable caching
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The runner's Ubuntu mirror is slow at times, and 127 archive fetches then outlast the job.
      - name: List the GStreamer packages
        id: gst-packages
        run: |
          # The job needs nothing from the Microsoft source, and its fetch can fail the update.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update
          mkdir -p "$RUNNER_TEMP/apt-archives/partial" "$RUNNER_TEMP/apt-empty/partial"
          echo "names=$GST_PACKAGES" >> "$GITHUB_OUTPUT"
          # The key hashes archive names and sizes; the mirror host in each URI changes per run.
          echo "versions=$(apt-get install --print-uris -qq --no-install-recommends \
            -o Dir::Cache::Archives="$RUNNER_TEMP/apt-empty" $GST_PACKAGES \
            | awk '{print $2, $3}' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
        env:
          GST_PACKAGES: >-
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly

      - name: Restore the GStreamer archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: gstreamer-apt-${{ runner.os }}-${{ steps.gst-packages.outputs.versions }}
          restore-keys: gstreamer-apt-${{ runner.os }}-

      - name: Install GStreamer
        run: |
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            -o Dir::Cache::Archives="$RUNNER_TEMP/apt-archives" -o APT::Keep-Downloaded-Packages=true \
            ${{ steps.gst-packages.outputs.names }}
          # A fallback restore brings superseded archives; drop them so the saved cache does not grow.
          sudo apt-get autoclean -o Dir::Cache::Archives="$RUNNER_TEMP/apt-archives"
          sudo chown -R "$USER" "$RUNNER_TEMP/apt-archives"

      - name: Set up Python
        run: uv venv --python 3.13

      - name: Install dependencies
        run: uv sync --locked

      # The GStreamer tests skip on a host without the software chain; this step fails instead.
      - name: Check the software H.264 chain
        env:
          PYTHONPATH: ${{ env.PYTHONPATH }}:$PWD
        run: uv run python -c 'from positronic.dataset.tests.test_gst_video import SOFTWARE_H264; SOFTWARE_H264.ensure_available()'

      - name: Run GStreamer encoder tests
        env:
          PYTHONPATH: ${{ env.PYTHONPATH }}:$PWD
        run: uv run pytest positronic/dataset/tests/test_gst_video.py

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install as package and verify imports
        run: |
          uv venv --python ${{ matrix.python }} /tmp/pkg-test
          uv pip install --no-sources --python /tmp/pkg-test ./client ./evals ./wire ./model_server ./vocabulary . jinja2
          /tmp/pkg-test/bin/python utilities/check_packaging.py

  # The evals install with no positronic and no client, and their tests pass in that environment.
  evals-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build the wheels
        run: |
          uv build --package positronic-eval-vocabulary --out-dir /tmp/evals-wheels
          uv build --package positronic-evals --out-dir /tmp/evals-wheels
      - name: Install the evals alone
        run: |
          uv venv --python ${{ matrix.python }} /tmp/evals-package
          uv pip install --python /tmp/evals-package --find-links /tmp/evals-wheels positronic-evals pytest
      - name: Run the package tests
        run: /tmp/evals-package/bin/python -I -m pytest -p no:cacheprovider -c /dev/null --import-mode=importlib evals/positronic_evals/tests

  model-server-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
        transport:
          - {extra: '', wires: ''}
          - {extra: '[websocket]', wires: 'websocket websocket_tls websocket_unix roboarena'}
          - {extra: '[grpc]', wires: 'grpc grpc_tls'}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build independent wheels
        run: |
          uv build --package positronic-wire --out-dir /tmp/model-wheels
          uv build --package positronic-model-server --out-dir /tmp/model-wheels
      - name: Install the selected transport without Positronic
        run: |
          uv venv --python ${{ matrix.python }} /tmp/model-package
          uv pip install --python /tmp/model-package --no-index --find-links /tmp/model-wheels --no-deps positronic-wire positronic-model-server
          uv pip install --python /tmp/model-package --find-links /tmp/model-wheels "positronic-model-server${{ matrix.transport.extra }}" 'numpy==1.26.4'
      - name: Check runtime dependencies, constant ownership, imports and serialization
        run: /tmp/model-package/bin/python -I utilities/check_model_server_package.py --wire ${{ matrix.transport.wires }}
      - name: Install test tools and run package tests
        run: |
          uv pip install --python /tmp/model-package pytest
          /tmp/model-package/bin/python -I -m pytest -p no:cacheprovider -c /dev/null --import-mode=importlib model_server/positronic_model_server/tests

  lerobot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enable caching
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv --python 3.13

      - name: Install dependencies
        run: uv sync --locked --extra lerobot_0_3_3

      - name: Run lerobot vendor tests
        env:
          PYTHONPATH: ${{ env.PYTHONPATH }}:$PWD
        run: uv run pytest positronic/vendors/lerobot_0_3_3/tests

  lerobot-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enable caching
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv --python 3.13

      - name: Install dependencies
        run: uv sync --locked --extra lerobot

      - name: Run lerobot vendor tests
        env:
          PYTHONPATH: ${{ env.PYTHONPATH }}:$PWD
        run: uv run pytest positronic/vendors/lerobot/tests

  llm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        extra: [llm, llm-openai]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv sync --locked --extra ${{ matrix.extra }}
      - run: uv run --no-sync pytest positronic/vendors/llm/tests

  openpi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable caching
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv --python 3.13

      - name: Install dependencies
        run: uv sync --locked --extra openpi

      - name: Run openpi vendor tests
        env:
          PYTHONPATH: ${{ env.PYTHONPATH }}:$PWD
        run: uv run pytest positronic/vendors/openpi/tests

  lockfile-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv venv --python ${{ matrix.python }}
      - name: uv sync --locked succeeds on ${{ matrix.os }} (py${{ matrix.python }})
        run: uv sync --locked
