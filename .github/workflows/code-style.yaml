name: Check code style

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for all branches and tags
    - name: Enable caching (uv)
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Set up Python
      run: uv venv --python 3.11
    - name: Install dev tools
      run: uv sync --locked
    - name: Determine diff base
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          BASE_SHA=${{ github.event.pull_request.base.sha }}
        else
          # For pushes, diff the whole pushed range, not just the tip commit.
          BASE_SHA="${{ github.event.before }}"
          # A new branch (all-zero before) or a force-pushed-away SHA has no local
          # object to diff against — fall back to the tip's parent.
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
        fi
        echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
    - name: Run Ruff linter
      run: |
        # Only check Python files that have changed
        CHANGED_FILES=$(git diff --name-only --diff-filter=d $BASE_SHA ${{ github.sha }})
        CHANGED_PY_FILES=$(echo "$CHANGED_FILES" | grep -E "\.py$" || true)

        if [ -n "$CHANGED_PY_FILES" ]; then
          echo "$CHANGED_PY_FILES" | xargs uv run ruff check --output-format=github
        else
          echo "No Python files changed"
        fi
    - name: Check tests location
      run: |
        CHANGED_PY_FILES=$(git diff --name-only --diff-filter=d $BASE_SHA ${{ github.sha }} | grep -E "\.py$" || true)
        if [ -n "$CHANGED_PY_FILES" ]; then
          echo "$CHANGED_PY_FILES" | xargs python3 utilities/check_tests_location.py
        fi
    - name: Run basedpyright type check
      # Whole-project type-check ratchet: fails on any error not grandfathered in
      # .basedpyright/baseline.json. The fresh dev-only venv above is the canonical
      # env the baseline is generated against, so no `--exact` is needed here.
      run: uv run --locked basedpyright
    - name: Check basedpyright baseline ratchet
      # Runs unconditionally: cheap, and fast-passes when no baseline file grew. RATCHET_BASE is the
      # PR base sha ($BASE_SHA); the script diffs against its merge-base with HEAD, since origin/main
      # does not resolve in this detached-HEAD checkout.
      env:
        RATCHET_BASE: ${{ env.BASE_SHA }}
      run: python3 utilities/check_basedpyright_baseline_ratchet.py
