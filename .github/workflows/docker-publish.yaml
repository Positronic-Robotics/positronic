name: Build and Push Positronic Images

on:
  push:
    branches:
      - main

jobs:
  # `positro/openpi` builds on this base.
  openpi-base:
    uses: ./.github/workflows/docker-openpi-base.yaml
    with:
      push: true
    secrets: inherit

  build-and-push:
    needs: openpi-base
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL"
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/node"
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/go"
          sudo rm -rf /usr/lib/jvm
          sudo docker system prune -af || true
          df -h

      # Docker 29 defaults to the containerd image store, which keeps each layer twice
      # (compressed and unpacked); this job builds every image and fills the disk with it.
      - name: Use the classic Docker image store
        run: |
          conf=/etc/docker/daemon.json
          sudo test -s "$conf" || echo '{}' | sudo tee "$conf" > /dev/null
          sudo jq '.features["containerd-snapshotter"] = false' "$conf" | sudo tee "$conf.new" > /dev/null
          sudo mv "$conf.new" "$conf"
          sudo systemctl restart docker
          test "$(docker info -f '{{.Driver}}')" = overlay2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        working-directory: docker
        run: |
          make push IMAGE_TAG=main

  # The public MolmoSpaces eval image, on a runner of its own: it does not fit on the disk beside the images above.
  molmospaces:
    uses: ./.github/workflows/docker-molmospaces.yaml
    with:
      push: true
    secrets: inherit
