name: Build and Push the pi0.5 DROID Serving Image

# Main republishes positro/pi05-droid on a change to its recipe, its vendor code or a workflow.
on:
  push:
    branches:
      - main
    paths:
      - docker/Dockerfile.serve-pi05-droid
      - positronic/vendors/openpi/**
      - .github/workflows/docker-serve-pi05-droid.yaml
      - .github/workflows/docker-serve-image.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serve-pi05-droid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  serve-image:
    uses: ./.github/workflows/docker-serve-image.yaml
    with:
      name: pi05-droid
    secrets: inherit
