name: Build the OpenPI Base Image

# Builds positro/openpi-base from the openpi fork at `OPENPI_REF` in docker/Makefile, unless Docker Hub holds it.
# A pull request builds it and pushes nothing. A caller passes `push` to publish it.
on:
  pull_request:
    paths:
      - docker/Makefile
      - .github/workflows/docker-openpi-base.yaml
  workflow_call:
    inputs:
      push:
        description: Push the image to Docker Hub after the build.
        required: false
        type: boolean
        default: false
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  openpi-base:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Two callers on one push wait for each other, so the second finds the build published and skips it.
    concurrency:
      group: openpi-base-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image is about 9 GB compressed, on a CUDA development base.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/lib/jvm /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/boost /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/az /opt/microsoft /opt/google /opt/pipx /usr/lib/google-cloud-sdk \
            /usr/share/miniconda "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          docker system prune -af --volumes > /dev/null
          df -h /

      - name: Build
        if: ${{ !inputs.push }}
        run: make -C docker build-openpi-base

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Only main moves `latest`. A dispatch on another ref pushes the commit tag alone.
      - name: Build and push
        if: inputs.push
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then unset CI; fi
          make -C docker push-openpi-base
