services:
  phail-openpi-server:
    extends:
      file: docker-compose.yml
      service: openpi-server
    container_name: phail-openpi-server
    pull_policy: always
    command: ["phail"]
    ports: !override
      - "8000:8000"

  phail-groot-server:
    extends:
      file: docker-compose.yml
      service: groot-server
    # These experiment checkpoints use the N1.6 action schema.
    image: ${GR00T_N16_IMAGE:?Set GR00T_N16_IMAGE to a pinned GR00T N1.6 image}
    entrypoint: ["uv", "run", "--python", "3.13", "python", "-m", "positronic.vendors.gr00t.server"]
    container_name: phail-groot-server
    pull_policy: always
    command: ["phail"]
    ports: !override
      - "8001:8000"

  phail-lerobot-server:
    extends:
      file: docker-compose.yml
      service: lerobot-0_3_3-server
    container_name: phail-lerobot-server
    pull_policy: always
    command: ["phail"]
    ports: !override
      - "8002:8000"
