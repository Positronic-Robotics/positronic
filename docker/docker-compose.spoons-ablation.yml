# GR00T spoons data ablation servers (~4.6GB each, 2 fit on desktop, 1 on notebook)
#
# Desktop (2 servers):
#   GR00T_N16_IMAGE=positro/gr00t:<N1.6-tag> CACHE_ROOT=/home/<user> docker --context desktop compose -f docker-compose.spoons-ablation.yml up spoons-100 spoons-50
# Notebook (1 server):
#   GR00T_N16_IMAGE=positro/gr00t:<N1.6-tag> docker --context notebook compose -f docker-compose.spoons-ablation.yml up spoons-25
services:
  spoons-100:
    extends:
      file: docker-compose.yml
      service: groot-server
    # These experiment checkpoints use the N1.6 action schema.
    image: ${GR00T_N16_IMAGE:?Set GR00T_N16_IMAGE to a pinned GR00T N1.6 image}
    entrypoint: ["uv", "run", "--no-sync", "--python", "3.13", "python", "-m", "positronic.vendors.gr00t.server"]
    container_name: spoons-100
    pull_policy: always
    command:
      - "ee_rot6d_rel"
      - "--pipeline.source.checkpoints_dir=s3://checkpoints/droid_spoons/groot/ee_rot6d_rel_100/"
    ports: !override
      - "8000:8000"

  spoons-50:
    extends:
      file: docker-compose.yml
      service: groot-server
    # These experiment checkpoints use the N1.6 action schema.
    image: ${GR00T_N16_IMAGE:?Set GR00T_N16_IMAGE to a pinned GR00T N1.6 image}
    entrypoint: ["uv", "run", "--no-sync", "--python", "3.13", "python", "-m", "positronic.vendors.gr00t.server"]
    container_name: spoons-50
    pull_policy: always
    command:
      - "ee_rot6d_rel"
      - "--pipeline.source.checkpoints_dir=s3://checkpoints/droid_spoons/groot/ee_rot6d_rel_50_v2/"
    ports: !override
      - "8001:8000"

  spoons-25:
    extends:
      file: docker-compose.yml
      service: groot-server
    # These experiment checkpoints use the N1.6 action schema.
    image: ${GR00T_N16_IMAGE:?Set GR00T_N16_IMAGE to a pinned GR00T N1.6 image}
    entrypoint: ["uv", "run", "--no-sync", "--python", "3.13", "python", "-m", "positronic.vendors.gr00t.server"]
    container_name: spoons-25
    pull_policy: always
    command:
      - "ee_rot6d_rel"
      - "--pipeline.source.checkpoints_dir=s3://checkpoints/droid_spoons/groot/ee_rot6d_rel_25/"
    ports: !override
      - "8002:8000"
