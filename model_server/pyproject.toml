[project]
name = "positronic-model-server"
version = "0.2.0"
description = "Model serving, session lifecycle and serialization without Positronic dependencies"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "msgpack>=1",
    "numpy>=1.26",
    "pillow>=10",
    "positronic-wire==0.12.0",
]

[project.optional-dependencies]
websocket = ["positronic-wire[websocket]==0.12.0", "uvicorn>=0.35"]
grpc = ["positronic-wire[grpc]==0.12.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["positronic_model_server"]
