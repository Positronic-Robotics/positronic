[project]
name = "positronic-wire"
version = "0.11.0"
description = "The client side of the transports a Positronic inference session runs over"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
websocket = ["websockets>=15.0.1"]
grpc = ["grpcio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `positronic_wire` carries no `__init__.py`; hatchling ships the named directory verbatim, py.typed
# among them — without it a type checker treats an INSTALLED copy as untyped (PEP 561).
packages = ["positronic_wire"]
